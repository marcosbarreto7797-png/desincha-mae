# App Desincha Mãe — servido ATRÁS do Caddy já existente na VPS.
# Não roda Caddy próprio: entra na rede externa do outro stack (evolution_interna),
# e aquele Caddy faz reverse_proxy para deploy-app-1:3000 (ver DEPLOY.md).
#
#   cd deploy
#   docker compose --env-file ../.env.production up -d --build
#
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* precisam entrar no build (vêm do --env-file)
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_KIWIFY_CHECKOUT_URL: ${NEXT_PUBLIC_KIWIFY_CHECKOUT_URL}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        NEXT_PUBLIC_PERMITIR_AUTO_CADASTRO: ${NEXT_PUBLIC_PERMITIR_AUTO_CADASTRO}
    env_file:
      - ../.env.production
    restart: unless-stopped
    networks:
      - evolution_interna
    expose:
      - "3000"

# Rede externa criada pelo stack do Evolution (onde está o Caddy).
networks:
  evolution_interna:
    external: true
