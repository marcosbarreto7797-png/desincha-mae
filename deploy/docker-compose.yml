# App Desincha Mãe + Caddy (TLS automático).
# O Supabase self-hosted sobe SEPARADO (ver DEPLOY.md) — este compose é só o app.
#
#   cd deploy
#   docker compose --env-file ../.env.production up -d --build
#
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* precisam entrar no build (vêm do --env-file)
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_KIWIFY_CHECKOUT_URL: ${NEXT_PUBLIC_KIWIFY_CHECKOUT_URL}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        NEXT_PUBLIC_PERMITIR_AUTO_CADASTRO: ${NEXT_PUBLIC_PERMITIR_AUTO_CADASTRO}
    env_file:
      - ../.env.production
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
